name: ci

on:
  pull_request:
  push:

jobs:
  changed-workflow-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ensure base branch ref is available
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
      - name: Changed-scope workflow report
        run: |
          python scripts/dev/dev_workflow_changed_check.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --json-out docs/test_outputs/dev_workflow/check_changed_ci.json
      - name: Upload changed-scope workflow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-changed-report
          path: docs/test_outputs/dev_workflow/check_changed_ci.json
      - name: Write changed-scope summary
        if: always()
        run: |
          python scripts/dev/dev_workflow_summary.py \
            --changed-json docs/test_outputs/dev_workflow/check_changed_ci.json \
            --title "Changed Workflow Check" \
            --markdown-out docs/test_outputs/dev_workflow/check_changed_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload changed-scope workflow summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-changed-summary
          path: docs/test_outputs/dev_workflow/check_changed_ci.md

  repo-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Repo safety report
        run: npm --prefix scripts run check:report
      - name: Write rulegen benchmark summary
        if: always()
        run: |
          python scripts/testing/rulegen_benchmark_summary.py \
            --benchmark-json docs/test_outputs/rulegen_benchmark_en_es_latest.json \
            --title "Rulegen Benchmark" \
            --markdown-out docs/test_outputs/rulegen_benchmark_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload rulegen benchmark summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulegen-benchmark-summary
          path: docs/test_outputs/rulegen_benchmark_ci.md
      - name: Rulegen quality gate (artifact policy)
        run: |
          python scripts/testing/rulegen_quality_gate.py \
            --benchmark-json docs/test_outputs/rulegen_benchmark_en_es_latest.json \
            --policy-json docs/test_inputs/rulegen_quality_policy.json \
            --baseline-json docs/test_outputs/baselines/rulegen_quality_baseline.json \
            --pos-probe-json docs/test_outputs/phase6_pos_inventory/phase6_pos_probe_2026-02-23_final.json \
            --pos-inventory-json docs/test_outputs/phase6_pos_inventory/phase6_pos_inventory_2026-02-23_final.json \
            --json-out docs/test_outputs/rulegen_quality_gate_ci.json
      - name: Upload rulegen quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulegen-quality-gate-report
          path: docs/test_outputs/rulegen_quality_gate_ci.json
      - name: Write rulegen quality gate summary
        if: always()
        run: |
          python scripts/testing/rulegen_quality_gate_summary.py \
            --gate-json docs/test_outputs/rulegen_quality_gate_ci.json \
            --title "Rulegen Quality Gate" \
            --markdown-out docs/test_outputs/rulegen_quality_gate_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload rulegen quality gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulegen-quality-gate-summary
          path: docs/test_outputs/rulegen_quality_gate_ci.md
      - name: Rebuild rulegen benchmark triage from latest benchmark artifact
        if: always()
        run: |
          python scripts/testing/rulegen_benchmark_triage.py \
            --benchmark-json docs/test_outputs/rulegen_benchmark_en_es_latest.json \
            --json-out docs/test_outputs/rulegen_benchmark_triage_ci.json \
            --markdown-out docs/test_outputs/rulegen_benchmark_triage_ci_full.md
      - name: Upload rulegen benchmark triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulegen-benchmark-triage-report
          path: docs/test_outputs/rulegen_benchmark_triage_ci.json
      - name: Write rulegen benchmark triage summary
        if: always()
        run: |
          python scripts/testing/rulegen_benchmark_triage_summary.py \
            --triage-json docs/test_outputs/rulegen_benchmark_triage_ci.json \
            --title "Rulegen Benchmark Triage" \
            --markdown-out docs/test_outputs/rulegen_benchmark_triage_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload rulegen benchmark triage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulegen-benchmark-triage-summary
          path: docs/test_outputs/rulegen_benchmark_triage_ci.md
      - name: Upload repo safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-report
          path: docs/test_outputs/dev_workflow/check_latest.json
      - name: Write repo safety summary
        if: always()
        run: |
          python scripts/dev/dev_workflow_summary.py \
            --check-json docs/test_outputs/dev_workflow/check_latest.json \
            --title "Repo Safety" \
            --markdown-out docs/test_outputs/dev_workflow/check_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload repo safety summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-summary
          path: docs/test_outputs/dev_workflow/check_ci.md

  build-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build safety report (CI-safe)
        run: npm --prefix scripts run build:ci:report
      - name: Upload build safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-report-ci-safe
          path: docs/test_outputs/dev_workflow/build_ci_latest.json
      - name: Write build safety summary
        if: always()
        run: |
          python scripts/dev/dev_workflow_summary.py \
            --build-json docs/test_outputs/dev_workflow/build_ci_latest.json \
            --title "Build Safety (CI Safe)" \
            --markdown-out docs/test_outputs/dev_workflow/build_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload build safety summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-summary-ci-safe
          path: docs/test_outputs/dev_workflow/build_ci.md

  build-safety-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Build safety report (macOS full)
        run: npm --prefix scripts run build:report
      - name: Upload macOS build safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-report-macos
          path: docs/test_outputs/dev_workflow/build_latest.json
      - name: Write macOS build safety summary
        if: always()
        run: |
          python scripts/dev/dev_workflow_summary.py \
            --build-json docs/test_outputs/dev_workflow/build_latest.json \
            --title "Build Safety (macOS Full)" \
            --markdown-out docs/test_outputs/dev_workflow/build_macos_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS build safety summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-summary-macos
          path: docs/test_outputs/dev_workflow/build_macos_ci.md

  windows-parity:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
      - name: Windows build report
        run: npm --prefix scripts run build:report
      - name: Upload Windows build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-report-windows
          path: docs/test_outputs/dev_workflow/build_latest.json
      - name: Write Windows build summary
        if: always()
        run: |
          python scripts/dev/dev_workflow_summary.py `
            --build-json docs/test_outputs/dev_workflow/build_latest.json `
            --title "Build Safety (Windows Full)" `
            --markdown-out docs/test_outputs/dev_workflow/build_windows_ci.md `
            --append-to "$env:GITHUB_STEP_SUMMARY"
      - name: Upload Windows build summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-build-summary-windows
          path: docs/test_outputs/dev_workflow/build_windows_ci.md
      - name: Windows parity audit
        run: npm --prefix scripts run check:windows:parity
      - name: Upload Windows parity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-windows-parity-report
          path: docs/test_outputs/dev_workflow/windows_parity_latest.json
      - name: Write Windows parity summary
        if: always()
        run: |
          python scripts/dev/windows_parity_summary.py `
            --audit-json docs/test_outputs/dev_workflow/windows_parity_latest.json `
            --title "Windows GUI Parity Audit" `
            --markdown-out docs/test_outputs/dev_workflow/windows_parity_ci.md `
            --append-to "$env:GITHUB_STEP_SUMMARY"
      - name: Upload Windows parity summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-windows-parity-summary
          path: docs/test_outputs/dev_workflow/windows_parity_ci.md

  srs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run SRS quality harness
        run: |
          python scripts/testing/srs_quality_harness.py \
            --json-out docs/test_outputs/srs_quality_ci.json
      - name: Upload SRS quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srs-quality-report
          path: docs/test_outputs/srs_quality_ci.json
      - name: Write SRS quality summary
        if: always()
        run: |
          python scripts/testing/srs_quality_summary.py \
            --quality-json docs/test_outputs/srs_quality_ci.json \
            --title "SRS Quality Harness" \
            --markdown-out docs/test_outputs/srs_quality_ci.md \
            --append-to "$GITHUB_STEP_SUMMARY"
      - name: Upload SRS quality summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srs-quality-summary
          path: docs/test_outputs/srs_quality_ci.md
