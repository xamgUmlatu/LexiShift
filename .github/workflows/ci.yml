name: ci

on:
  pull_request:
  push:

jobs:
  project-health-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure base branch ref is available
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
      - name: Project health gate (changed files)
        working-directory: scripts
        run: |
          node dev/check_project_health.js \
            --changed-only \
            --base-ref "origin/${{ github.base_ref }}" \
            --baseline-json ../docs/test_outputs/project_health/project_health_baseline.json \
            --fail-on-new \
            --fail-on-regressions

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Typecheck core
        run: mypy core/lexishift_core
      - name: Core tests
        run: python -m unittest discover -s core/tests
      - name: Rulegen quality gate (artifact policy)
        run: |
          python scripts/testing/rulegen_quality_gate.py \
            --benchmark-json docs/test_outputs/rulegen_benchmark_en_es_latest.json \
            --policy-json docs/test_inputs/rulegen_quality_policy.json \
            --baseline-json docs/test_outputs/baselines/rulegen_quality_baseline.json \
            --pos-probe-json docs/test_outputs/phase6_pos_inventory/phase6_pos_probe_2026-02-23_final.json \
            --pos-inventory-json docs/test_outputs/phase6_pos_inventory/phase6_pos_inventory_2026-02-23_final.json
