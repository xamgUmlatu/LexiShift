<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SPA Route Fixture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 40px;
      max-width: 820px;
      line-height: 1.6;
    }
    button {
      font: inherit;
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>SPA Route Fixture</h1>
    <p id="route-copy">
      Initial route: companies, schools, researched lessons, and cooked meals.
    </p>
    <button id="route-button" type="button">Change route text</button>
  </main>
  <script>
    document.getElementById("route-button").addEventListener("click", () => {
      history.pushState({}, "", "#second-route");
      document.getElementById("route-copy").textContent = [
        "Second route:",
        "companies researched newer technologies",
        "teachers compared reports from universities",
        "cultures and countries appeared while cooks prepared meals"
      ].join(" ");
    });
  </script>
</body>
</html>
